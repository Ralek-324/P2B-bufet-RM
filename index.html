<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Objednávka školního bufetu</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
}
h1 {
    text-align: center;
    background: #2a72d4;
    color: white;
    padding: 20px;
}
.container {
    width: 90%;
    max-width: 500px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
}
.item {
    display: flex;
    justify-content: space-between;
    margin: 12px 0;
}
input[type="number"] {
    width: 70px;
    text-align: center;
}

/* ✅ styling vstupů */
.input-group {
    margin-top: 15px;
}

label {
    display: block;
    font-size: 14px;
    margin-bottom: 5px;
    font-weight: bold;
}

input[type="text"] {
    width: 100%;
    padding: 10px;
    font-size: 16px;
}

#celkem, #pocet {
    text-align: center;
    font-size: 20px;
    margin-top: 10px;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    font-size: 22px;
    background: #ff6b35;
    color: white;
    border: none;
}
</style>
</head>

<body>

<h1>SŠ Kostka – OBJEDNÁVKY BUFET</h1>

<div class="container">

    <div id="items"></div>

    <div id="celkem">Celková cena: 0 Kč</div>
    <div id="pocet">Počet kusů: 0</div>

    <!-- ✅ NOVÉ POLE – JMÉNO -->
    <div class="input-group">
        <label for="jmeno">VAŠE JMÉNO (Příjmení Jméno)</label>
        <input type="text" id="jmeno" placeholder="Novák Jan">
    </div>

    <!-- ✅ NOVÉ POLE – TELEFON -->
    <div class="input-group">
        <label for="telefon">TELEFON</label>
        <input type="text" id="telefon" placeholder="+420 000 000 000">
    </div>

    <button onclick="odeslatObjednavku()">ODESLAT OBJEDNÁVKU</button>

</div>

<script>

let items = [];

// ✅ Načtení CSV
async function loadCSV() {
    const res = await fetch("data_bufet.csv?t=" + Date.now());
    const text = await res.text();
    parseCSV(text);
    renderItems();
}

// ✅ Parsování CSV
function parseCSV(text) {
    items = [];
    const lines = text.split("\n");

    for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        const [nazev, cena] = line.split(";");

        if (nazev && cena) {
            items.push({
                nazev: nazev.trim(),
                cena: parseFloat(cena),
                mnozstvi: 0
            });
        }
    }
}

// ✅ Vykreslení položek
function renderItems() {
    const container = document.getElementById("items");
    container.innerHTML = "";

    items.forEach((item, i) => {
        container.innerHTML += `
            <div class="item">
                <span>${item.nazev} (${item.cena} Kč)</span>
                <input type="number" min="0"
                onchange="updateItem(${i}, this.value)">
            </div>
        `;
    });
}

// ✅ Změna množství
function updateItem(i, val) {
    items[i].mnozstvi = parseInt(val) || 0;
    updateSummary();
}

// ✅ Přepočet
function updateSummary() {
    let celkem = 0;
    let pocet = 0;

    items.forEach(i => {
        celkem += i.cena * i.mnozstvi;
        pocet += i.mnozstvi;
    });

    document.getElementById("celkem").innerText =
        "Celková cena: " + celkem + " Kč";
    document.getElementById("pocet").innerText =
        "Počet kusů: " + pocet;
}


// ✅ HLAVNÍ FUNKCE – OPRAVENÉ MAILTO
function odeslatObjednavku() {

    const jmeno = document.getElementById("jmeno").value.trim();
    const telefon = document.getElementById("telefon").value.trim();

    // ✅ validace
    if (!jmeno) {
        alert("Vyplňte jméno");
        return;
    }

    if (!telefon) {
        alert("Vyplňte telefon");
        return;
    }

    let celkem = 0;
    let pocet = 0;

    const seznam = items
        .filter(i => i.mnozstvi > 0)
        .map(i => {
            celkem += i.cena * i.mnozstvi;
            pocet += i.mnozstvi;
            return `${i.nazev}: ${i.mnozstvi} ks (${i.cena * i.mnozstvi} Kč)`;
        });

    if (seznam.length === 0) {
        alert("Nevybrány žádné položky");
        return;
    }

    // ✅ TĚLO EMAILU
    const body = 
`Objednávka z bufetu

Jméno: ${jmeno}
Telefon: ${telefon}

Položky:
${seznam.join("\n")}

Celkový počet kusů: ${pocet}
Celková cena: ${celkem} Kč`;

    // ✅ KRITICKÁ OPRAVA:
    // vše v jednom řádku + encodeURIComponent
    const mailto =
        "mailto:machalek.roman@kostka-skola.cz"
        + "?subject=" + encodeURIComponent("Objednávka bufet")
        + "&body=" + encodeURIComponent(body);

    // ✅ otevření klienta
    window.location.href = mailto;
}

loadCSV();

</script>

</body>
</html>
