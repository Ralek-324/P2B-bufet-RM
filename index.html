<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Objednávka školního bufetu</title>

<style>
body {
    font-family: Arial;
    background: #f4f7fb;
}
h1 {
    text-align: center;
    background: #2a72d4;

}
.container {

.item {

    justify-content: space-between;

.input-group {

}
label {

}

    width: 100%;

}
button {
    width: 100%;

    background: orange;

    border: none;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>SŠ Kostka – OBJEDNÁVKY BUFET</h1>

<div class="container">

<div id="items"></div>

<div id="celkem">Celková cena: 0 Kč</div>
<div id="pocet">Počet kusů: 0</div>

<div class="input-group">
<label>VAŠE JMÉNO (Příjmení Jméno)</label>
<input type="text" id="jmeno">
</div>

<div class="input-group">
<label>TELEFON</label>
<input type="text" id="telefon" placeholder="+420 000 000 000">
</div>

<!-- ✅ KLÍČOVÉ: button uvnitř anchor -->
<a id="mailLink" href="#">
<button onclick="return pripravMail()">ODESLAT OBJEDNÁVKU</button>
</a>

</div>

<script>

let items = [];

async function loadCSV() {
    const res = await fetch("data_bufet.csv?t=" + Date.now());
    const text = await res.text();
    parseCSV(text);
    renderItems();
}

function parseCSV(text) {
    const lines = text.split("\n");
    items = [];

    for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        const [nazev, cena] = line.split(";");

        items.push({
            nazev: nazev,
            cena: parseFloat(cena),
            mnozstvi: 0
        });
    }
}

function renderItems() {
    const container = document.getElementById("items");
    container.innerHTML = "";

    items.forEach((item, i) => {
        container.innerHTML += `
        <div class="item">
            <span>${item.nazev} (${item.cena} Kč)</span>
            <input type="number" min="0"
            onchange="updateItem(${i}, this.value)">
        </div>`;
    });
}

function updateItem(i, val) {
    items[i].mnozstvi = parseInt(val) || 0;
    updateSummary();
}

function updateSummary() {
    let celkem = 0;
    let pocet = 0;

    items.forEach(i => {
        celkem += i.cena * i.mnozstvi;
        pocet += i.mnozstvi;
    });

    document.getElementById("celkem").innerText =
        "Celková cena: " + celkem + " Kč";
    document.getElementById("pocet").innerText =
        "Počet kusů: " + pocet;
}
