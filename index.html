<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Bufet objednávka</title>
    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: 20px auto;
        }
        input, button {
            padding: 8px;
            margin: 5px 0;
            width: 100%;
        }
    </style>
</head>
<body>

<h1>Školní bufet</h1>

<!-- ============================= -->
<!-- NOVÁ POVINNÁ POLE PRO ZÁKAZNÍKA -->
<!-- ============================= -->
<label>VAŠE JMÉNO (Příjmení Jméno):</label>
<input type="text" id="jmeno" placeholder="Novák Jan" required>

<label>TELEFON:</label>
<input type="tel" id="telefon" placeholder="+420 000 000 000" required>

<hr>

<h2>Objednávka</h2>

<!-- JEDNODUCHÝ SIMULOVANÝ SEZNAM PRODUKTŮ -->
<div>
    <label>Bageta (50 Kč):</label>
    <input type="number" id="bageta" min="0" value="0">

    <label>Koláč (30 Kč):</label>
    <input type="number" id="kolac" min="0" value="0">

    <label>Voda (20 Kč):</label>
    <input type="number" id="voda" min="0" value="0">
</div>

<hr>

<button onclick="odeslatObjednavku()">ODESLAT OBJEDNÁVKU</button>

<script>
function odeslatObjednavku() {

    // =============================
    // VALIDACE POVINNÝCH POLÍ
    // =============================
    const jmeno = document.getElementById("jmeno").value.trim();
    const telefon = document.getElementById("telefon").value.trim();

    if (!jmeno || !telefon) {
        alert("Vyplňte prosím jméno a telefon.");
        return;
    }

    // =============================
    // NAČTENÍ OBJEDNÁVKY
    // =============================
    let objednavka = [];
    let celkem = 0;

    const produkty = [
        {name: "Bageta", price: 50, id: "bageta"},
        {name: "Koláč", price: 30, id: "kolac"},
        {name: "Voda", price: 20, id: "voda"}
    ];

    produkty.forEach(p => {
        let qty = parseInt(document.getElementById(p.id).value) || 0;
        if (qty > 0) {
            let suma = qty * p.price;
            celkem += suma;
            objednavka.push(`${p.name} - ${qty} ks - ${suma} Kč`);
        }
    });

    if (objednavka.length === 0) {
        alert("Objednávka je prázdná.");
        return;
    }

    // =============================
    // SESTAVENÍ TEXTU E-MAILU
    // =============================
    let body = 
`Nová objednávka:

Jméno: ${jmeno}
Telefon: ${telefon}

Objednávka:
${objednavka.join("\n")}

Celková cena: ${celkem} Kč`;

    // =============================
    // MAILTO FUNKCE
    // OTEVŘE E-MAILOVÉHO KLIENTA
    // =============================
    let mailtoLink = `mailto:machalek.roman@kostka-skola.cz?subject=${encodeURIComponent("Objednávka bufet")}&body=${encodeURIComponent(body)}`;

    window.location.href = mailtoLink;
}
</script>

</body>
</html>
