<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Objednávka školního bufetu</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
}
h1 {
    text-align: center;
    background: #2a72d4;
    color: white;
    padding: 20px;
}
.container {
    width: 90%;
    max-width: 500px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
}
.item {
    display: flex;
    justify-content: space-between;
    margin: 12px 0;
}
input[type="number"] {
    width: 70px;
    text-align: center;
}
input[type="text"] {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}
#celkem, #pocet {
    text-align: center;
    font-size: 20px;
    margin-top: 10px;
    font-weight: bold;
}
button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    font-size: 22px;
    background: #ff6b35;
    color: white;
    border: none;
}
</style>
</head>

<body>

<h1>SŠ Kostka – OBJEDNÁVKY BUFET</h1>

<div class="container">

    <div id="items"></div>

    <div id="celkem">Celková cena: 0 Kč</div>
    <div id="pocet">Počet kusů: 0</div>

    <!-- ✅ NOVÁ POVINNÁ POLE -->
    <input type="text" id="jmeno" placeholder="VAŠE JMÉNO (Příjmení Jméno)">
    <input type="text" id="telefon" placeholder="TELEFON (+420 000 000 000)">

    <button onclick="odeslatObjednavku()">ODESLAT OBJEDNÁVKU</button>

</div>

<script>

let items = [];

async function loadCSV() {
    const res = await fetch("data_bufet.csv?t=" + Date.now());
    const text = await res.text();
    parseCSV(text);
    renderItems();
}

function parseCSV(text) {
    items = [];
    const lines = text.split("\n");

    for (let i = 1; i < lines.length; i++) {
        const [nazev, cena] = lines[i].split(";");
        if (nazev && cena) {
            items.push({
                nazev: nazev.trim(),
                cena: parseFloat(cena),
                mnozstvi: 0
            });
        }
    }
}

function renderItems() {
    const container = document.getElementById("items");
    container.innerHTML = "";

    items.forEach((item, i) => {
        container.innerHTML += `
            <div class="item">
                <span>${item.nazev} (${item.cena} Kč)</span>
                <input type="number" min="0"
                onchange="updateItem(${i}, this.value)">
            </div>
        `;
    });
}

function updateItem(i, val) {
    items[i].mnozstvi = parseInt(val) || 0;
    updateSummary();
}

function updateSummary() {
    let celkem = 0;
    let pocet = 0;

    items.forEach(i => {
        celkem += i.cena * i.mnozstvi;
        pocet += i.mnozstvi;
    });

    document.getElementById("celkem").innerText =
        "Celková cena: " + celkem + " Kč";
    document.getElementById("pocet").innerText =
        "Počet kusů: " + pocet;
}


// ✅ HLAVNÍ MAILTO LOGIKA
function odeslatObjednavku() {

    const jmeno = document.getElementById("jmeno").value.trim();
    const telefon = document.getElementById("telefon").value.trim();

    if (!jmeno) {
        alert("Vyplňte jméno");
        return;
    }

    if (!telefon) {
        alert("Vyplňte telefon");
        return;
    }

    let celkem = 0;
    let pocet = 0;

    const seznam = items
        .filter(i => i.mnozstvi > 0)
        .map(i => {
            celkem += i.cena * i.mnozstvi;
            pocet += i.mnozstvi;
            return `${i.nazev}: ${i.mnozstvi} ks (${i.cena * i.mnozstvi} Kč)`;
        });

    if (seznam.length === 0) {
        alert("Nevybrány žádné položky");
        return;
    }

    const body = `Objednávka z bufetu

Jméno: ${jmeno}
Telefon: ${telefon}

Položky:
${seznam.join("\n")}

Celkový počet kusů: ${pocet}
Celková cena: ${celkem} Kč`;

    // ✅ MAILTO
    const mailto = `mailto:machalek.roman@kostka-skola.cz?subject=Objednávka bufet&body=${encodeURIComponent(body)}`;

    window.location.href = mailto;
}

loadCSV();

</script>

</body>
</html>
